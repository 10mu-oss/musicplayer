<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC PLAYER</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body,h2,p,ul,li,div{margin: 0; padding: 0; box-sizing: border-box;}
        ul{list-style:none;}
        :root{
            --color-red:#ff5f7e; --body-bg:#080c17; --play-bg:#111827; --color-light:#f8fafc;
            --color-shadow:#020617; --text-color:#94a3b8; --bar-bg:#7dd3fc; --text-size:24px;
            --line-color:#263449; --control-bg:#1e293b; --control-hover:#27364a;
            --list-bg:#111827; --volume-bg:rgba(17,24,39,0.88);
        }
        body{
            height:100vh; background: var(--body-bg); display: flex; justify-content: center; align-items: center;
        }
        .player_body{
            width:360px; padding: 25px 30px; border-radius: 16px; background: var(--play-bg);
            user-select: none; position:relative; border: 1px solid var(--line-color);
        }
        .top{margin-bottom: 25px;}
        .top>h2{
            font-size: var(--text-size); font-weight: 500; color: var(--text-color);
            text-align: center; letter-spacing: 2px; text-transform: uppercase;
        }
        .album{height:260px; border-radius: 12px; overflow: hidden;}
        .album{position: relative; background: linear-gradient(135deg, #172033, #0f172a);}
        .album>img{
            width:100%; height:100%; object-fit: cover; object-position: center bottom;
            transform: scale(1.05); display:block;
        }
        .album.is-missing::before{
            content: 'NO COVER'; position:absolute; inset:0; display:flex; justify-content:center; align-items:center;
            color: var(--text-color); letter-spacing: 3px; font-size: 14px;
        }
        .album.is-missing>img{display:none;}
        .info{
            text-align: center; font-size: calc(var(--text-size) * 0.8); 
            margin: calc(var(--text-size) * 0.5);
        }
        .info>.name{color: var(--color-light);}
        .info>.artist{font-size: calc(var(--text-size) * 0.6); color: var(--text-color);}
        .progress{height:4px; border-radius: 4px; background: var(--control-bg);}
        .progress>.bar{
            width:10%; height:4px; border-radius: 4px; background: var(--bar-bg);
        }
        .progress>.timebox{
            margin-top: 8px; font-size: calc(var(--text-size) * 0.5); display: flex;
            justify-content: space-between;
        }
        .progress>.timebox>span{color: var(--text-color);}
        .controls{margin-top: 40px; display: flex; justify-content: space-between; align-items: center;}
        .controls>span{
            font-size: var(--text-size); width:40px; height:40px; border-radius: 50%; background: var(--control-bg);
            color: var(--text-color); display: flex; justify-content: center; align-items: center;
        }
        .controls>span:hover, .controls>span:active{color: var(--color-red); background: var(--control-hover);}
        #playBtn:hover, #playBtn:active{background: var(--color-red) !important; color: var(--color-light) !important;}
        .play_list{
            position: absolute; left: 30px; top: 100px; width:300px; min-height:350px; background: var(--list-bg);
            color: var(--color-light); padding: 20px; box-sizing: border-box; border-radius: 8px; display: none;
        }
        .play_list.active{display: block;}
        .play_list li{
            border-bottom: 1px solid var(--line-color); font-size: 16px; letter-spacing: -1px; padding: 5px 0;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .play_list li>strong{font-weight: normal;}
        .play_list li>em{font-style: normal; font-size: 12px; color: var(--text-color);}
        .play_list li.active{color: var(--color-red);}
        .volume{position: relative; text-align: right;}
        .volume #volume-btn{cursor:pointer; color: var(--text-color);}
        .volume #volume-btn.open{color: var(--color-red);}
        .volume #volume-ctrl{
            width:30px; height:135px; background: var(--volume-bg); border-radius: 7px; 
            border: 1px solid var(--line-color); position: absolute; right: 0; bottom: 28px;
        }
        .volume #volume-ctrl.hidden{display: none;}
        .volume .volumebg{
            width:6px; height:90%; border-radius: 3px; background: var(--control-bg); position: absolute;
            left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden;
        }
        .volume .volumerange{
            -webkit-appearance:none; appearance: none;
            width:121px; position: absolute; right: 1px; top: -4px; background: transparent;
            transform-origin: center right; transform: rotate(270deg); overflow: hidden;
            cursor:pointer; z-index:10000;
        }
        .volume .volumerange:focus{outline: none;}
        .volume .volumerange::-webkit-slider-runnable-track{
            width:100%; height:100%; cursor:pointer; border-radius: 3px;
        }
        .volume .volumerange::-webkit-slider-thumb{
            -webkit-appearance:none; appearance: none; width:6px; height:6px; border-radius: 50%;
            background: var(--color-light);
        }
    </style>
</head>
<body>
    <div class="player_body">
        <div class="top">
            <h2>MUSIC PLAYER</h2>
        </div>
        <div class="album">
            <img src="./images/album1.jpg" alt="Alone -- Color Out">
        </div>
        <div class="volume">
            <span id="volume-btn" class="material-icons">volume_up</span>
            <div id="volume-ctrl" class="hidden">
                <div class="volumebg">
                    <input type="range" min="0" max="100" value="50" step="1" class="volumerange">
                </div>
            </div>
        </div>
        <div class="info">
            <p class="name">Alone</p>
            <p class="artist">Color Out</p>
        </div>
        <div class="etc">
            <div class="play_list">
                <ul></ul>
            </div>
        </div>
        <div class="progress">
            <div class="bar"></div>
            <audio src="" id="mainAudio"></audio>
            <div class="timebox">
                <span class="current">0:00</span><span class="duration">0:00</span>
            </div>
        </div>
        <div class="controls">
            <span id="repeatBtn" class="material-icons">repeat</span>
            <span id="prevBtn" class="material-icons">skip_previous</span>
            <span id="playBtn" class="material-icons">play_arrow</span>
            <span id="nextBtn" class="material-icons">skip_next</span>
            <span id="listBtn" class="material-icons">queue_music</span>
        </div>
    </div>
    <script src="./music_list.js"></script>
    <script>
        const musicApp = document.querySelector('.player_body');
        const musicAudio = musicApp.querySelector('#mainAudio');
        const playBtn = musicApp.querySelector('#playBtn');
        const albumBox = musicApp.querySelector('.album');
        const albumImg = musicApp.querySelector('.album>img');
        const musicName = musicApp.querySelector('.name');
        const artistName = musicApp.querySelector('.artist');
        const totalTime = musicApp.querySelector('.duration');
        const playTime = musicApp.querySelector('.current');
        const progressive = musicApp.querySelector('.progress');
        const progressBar = musicApp.querySelector('.bar');
        const prevBtn = musicApp.querySelector('#prevBtn');
        const nextBtn = musicApp.querySelector('#nextBtn');
        const repeatBtn = musicApp.querySelector('#repeatBtn');
        const listBox = musicApp.querySelector('.play_list');
        const listBtn = musicApp.querySelector('#listBtn');
        const volumeBtn = musicApp.querySelector('#volume-btn');
        const volumeCtrl = musicApp.querySelector('#volume-ctrl');
        const volumeRange = musicApp.querySelector('.volumerange');

        let list_index = 0;

        const getMusicList = () => {
            if(typeof musicList !== 'undefined' && Array.isArray(musicList)){
                return musicList;
            }
            if(Array.isArray(window.musicList)){
                return window.musicList;
            }
            return [];
        };

        const cleanFileName = (fileName) => String(fileName || '').trim();

        const getImagePath = (imgName, index) => {
            const name = cleanFileName(imgName || `album${index + 1}`);
            if(/\.(jpg|jpeg|png|webp|gif)$/i.test(name)){
                return `./images/${name}`;
            }
            return `./images/${name}.jpg`;
        };

        const getAudioPath = (audioName) => {
            const name = cleanFileName(audioName);
            if(!name){
                return '';
            }
            if(/^https?:\/\//i.test(name) || name.startsWith('./') || name.startsWith('../') || name.startsWith('/')){
                return name;
            }
            if(/\.(mp3|wav|ogg|m4a)$/i.test(name)){
                return `./audio/${name}`;
            }
            return `./audio/${name}.mp3`;
        };

        const formatTime = (seconds) => {
            if(!Number.isFinite(seconds) || seconds < 0){
                return '00 : 00';
            }
            const min = String(Math.floor(seconds / 60)).padStart(2, '0');
            const sec = String(Math.floor(seconds % 60)).padStart(2, '0');
            return `${min} : ${sec}`;
        };

        albumImg.addEventListener('error', () => {
            albumBox.classList.add('is-missing');
            console.warn('앨범 이미지 경로를 확인하세요:', albumImg.getAttribute('src'));
        });

        musicAudio.addEventListener('loadedmetadata', () => {
            totalTime.textContent = formatTime(musicAudio.duration);
        });

        musicAudio.addEventListener('error', () => {
            playBtn.innerHTML = 'play_arrow';
            console.error('오디오 파일을 불러오지 못했습니다. 경로를 확인하세요:', musicAudio.getAttribute('src'));
        });

        const loadMusic = (num) => {
            const list = getMusicList();
            if(list.length === 0){
                console.error('music_list.js에서 musicList 배열을 찾지 못했습니다.');
                musicName.textContent = 'No Music List';
                artistName.textContent = 'music_list.js 확인';
                totalTime.textContent = '00 : 00';
                musicAudio.removeAttribute('src');
                musicAudio.load();
                return;
            }

            list_index = Number(num) || 0;
            const item = list[list_index];

            const audioName = item.audio || item.src || item.file || item.mp3 || item.url || '';
            const imageName = item.img || item.image || item.cover || `album${list_index + 1}`;

            musicAudio.src = getAudioPath(audioName);
            musicAudio.load();

            albumBox.classList.remove('is-missing');
            albumImg.style.display = '';
            albumImg.src = getImagePath(imageName, list_index);

            musicName.textContent = item.name || item.title || '';
            artistName.textContent = item.artist || item.singer || '';
            totalTime.textContent = item.total || '00 : 00';
            playTime.textContent = '00 : 00';
            progressBar.style.width = '0%';
            listClassActive();
        };

        const musicPlay = () => {
            const src = musicAudio.getAttribute('src');
            if(!src){
                console.error('재생할 오디오 경로가 비어 있습니다. music_list.js의 audio 값을 확인하세요.');
                playBtn.innerHTML = 'play_arrow';
                return;
            }

            playBtn.innerHTML = 'pause';
            const playPromise = musicAudio.play();

            if(playPromise && typeof playPromise.catch === 'function'){
                playPromise.catch((error) => {
                    playBtn.innerHTML = 'play_arrow';
                    console.error('오디오 재생 실패:', error, '현재 src:', musicAudio.currentSrc || src);
                });
            }
        };

        const musicPause = () => {
            playBtn.innerHTML = 'play_arrow';
            musicAudio.pause();
        };

        const prevMusic = () => {
            const list = getMusicList();
            if(list.length === 0){ return; }

            list_index--;
            if(list_index < 0){
                list_index = list.length - 1;
            }

            loadMusic(list_index);
            musicPlay();
        };

        const nextMusic = () => {
            const list = getMusicList();
            if(list.length === 0){ return; }

            list_index++;
            if(list_index >= list.length){
                list_index = 0;
            }

            loadMusic(list_index);
            musicPlay();
        };

        const listClassActive = () => {
            const musicListName = listBox.querySelectorAll('li');
            musicListName.forEach((list) => {
                if(Number(list.getAttribute('data-index')) === Number(list_index)){
                    list.classList.add('active');
                } else {
                    list.classList.remove('active');
                }
            });
        };

        const renderMusicList = () => {
            const list = getMusicList();
            const ul = listBox.querySelector('ul');
            ul.innerHTML = '';

            const fragment = document.createDocumentFragment();

            list.forEach((item, i) => {
                const li = document.createElement('li');
                li.setAttribute('data-index', i);

                const strong = document.createElement('strong');
                strong.textContent = item.name || item.title || `Track ${i + 1}`;

                const em = document.createElement('em');
                em.textContent = item.artist || item.singer || '';

                li.appendChild(strong);
                li.appendChild(em);
                fragment.appendChild(li);
            });

            ul.appendChild(fragment);

            ul.querySelectorAll('li').forEach((listItem) => {
                listItem.addEventListener('click', (e) => {
                    list_index = Number(e.currentTarget.dataset.index);
                    loadMusic(list_index);
                    musicPlay();
                });
            });

            listClassActive();
        };

        playBtn.addEventListener('click', () => {
            if(playBtn.innerText === 'play_arrow'){
                musicPlay();
            } else {
                musicPause();
            }
        });

        nextBtn.addEventListener('click', nextMusic);
        prevBtn.addEventListener('click', prevMusic);

        progressive.addEventListener('click', (e) => {
            const duration = musicAudio.duration;
            if(!Number.isFinite(duration) || duration <= 0){
                return;
            }

            const clickPosition = e.offsetX;
            const maxWidth = progressive.clientWidth;
            musicAudio.currentTime = (clickPosition / maxWidth) * duration;

            if(playBtn.innerHTML === 'play_arrow'){
                musicPlay();
            }
        });

        musicAudio.addEventListener('timeupdate', (e) => {
            const current = e.target.currentTime || 0;
            const duration = e.target.duration || 0;

            if(!Number.isFinite(duration) || duration <= 0){
                progressBar.style.width = '0%';
                return;
            }

            const progressRatio = (current / duration) * 100;
            progressBar.style.width = `${progressRatio}%`;
            playTime.textContent = formatTime(current);
        });

        musicAudio.addEventListener('ended', () => {
            const getTextRepeat = repeatBtn.innerText;

            if(getTextRepeat === 'repeat'){
                nextMusic();
            } else {
                loadMusic(list_index);
                musicPlay();
            }
        });

        repeatBtn.addEventListener('click', () => {
            const getTextRepeat = repeatBtn.innerText;

            switch(getTextRepeat){
                case 'repeat':
                    repeatBtn.innerText = 'repeat_one';
                    repeatBtn.setAttribute('title', '한곡 반복');
                    break;
                case 'repeat_one':
                    repeatBtn.innerText = 'repeat';
                    repeatBtn.setAttribute('title', '전체 반복');
                    break;
            }
        });

        listBtn.addEventListener('click', () => {
            listBox.classList.toggle('active');
        });

        volumeBtn.addEventListener('click', () => {
            volumeCtrl.classList.toggle('hidden');
            volumeBtn.classList.toggle('open');
        });

        volumeRange.addEventListener('input', (e) => {
            musicAudio.volume = Number(e.target.value) / 100;
        });

        musicAudio.volume = Number(volumeRange.value) / 100;

        renderMusicList();
        loadMusic(list_index);
    </script>
</body>
</html>
